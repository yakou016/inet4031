[changelog]
header = "# Capstone commit history\n\n"
body = '''
{% if version %}
## {{ version }}
{% else %}
## Unreleased
{% endif %}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first }} ([commit](https://github.com/yakou016/inet4031/commit/{{ commit.id }}))
{% endfor %}
'''
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  { message = ".*", group = "Changes" },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
