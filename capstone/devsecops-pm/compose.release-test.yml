# Disposable test credentials only. Never use these for the live database.
services:
  web:
    image: ${RELEASE_IMAGE:?Set RELEASE_IMAGE}
    pull_policy: never
    user: "10001:10001"
    ports:
      - "127.0.0.1:18080:5000"
    environment:
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: disposable_test_only
      POSTGRES_DB: release_test
      FLASK_SECRET_KEY: disposable-test-only
      PORT: "5000"
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: disposable_test_only
      POSTGRES_DB: release_test
    mem_limit: 256m
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "release_test", "-d", "release_test"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
